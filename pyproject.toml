[project]
name = "cq-zones-mcp"
version = "0.1.0"
description = "CQ zones as CQ publishes them (WAZ Zone Definitions), in ADIF's DXCC and subdivision codes"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "ki7mt@yahoo.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
]
keywords = [
    "amateur-radio", "ham-radio", "qso-graph", "mcp", "model-context-protocol", "adif",
    "cq-zones", "waz", "worked-all-zones", "cq-ww", "zones",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/cq-zones/"
Repository = "https://github.com/qso-graph/cq-zones-mcp"
Issues = "https://github.com/qso-graph/cq-zones-mcp/issues"

[project.scripts]
cq-zones-mcp = "cq_zones_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "adif-mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cq_zones_mcp"]
